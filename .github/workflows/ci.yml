# The package on three operating systems: format check, tests without network or R, then the
# network tests, among them the seeded 20-problem subset of the candidate list (ADR 0003). The
# weekly fetch is weekly-fetch.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no major tag
        with:
          python-version: '3.14'
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run pytest -rs
      - run: uv run pytest -rs -m network
