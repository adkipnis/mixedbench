# Tier O keyword net (#24): OpenML, UCI and PMLB searched for tables with a documented clustering
# column; the cap applies over the three repositories together, drawn with `seed` where exceeded.
nets:
  repositories: [openml, uci, pmlb]
  keywords: [subject, participant, patient, site, hospital, school, classroom, plot, block, herd, farm, judge, rater, family, household, litter]
  cap: 30
