[project]
name = "mixedbench"
version = "1.0.0"
description = "A benchmark of posterior approximation and prediction on real grouped data for GLMMs"
readme = "README.md"
license = "MIT"
authors = [{ name = "Alex Kipnis", email = "adkipnis@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "pyyaml",
    "pyreadr>=0.5.7,<0.6",  # readers.RFile parses with its internal PyreadrParser
    "openpyxl",
    "xlrd",
    "pyreadstat",
    "pyarrow",
    "rdata",
]

[project.optional-dependencies]
# The reference sampler stack (brms and cmdstanr in an R subprocess), roadmap item 5.
references = []

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "nbmake",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The repository keeps one copy of the registry files at registry/; the wheel carries them as
# mixedbench/registry/files/. The editable install copies them into site-packages too, so the
# cache keys make `uv run` reinstall after merge.py rewrites one.
[tool.hatch.build.targets.wheel]
packages = ["src/mixedbench"]

[tool.hatch.build.targets.wheel.force-include]
"registry/sources.yaml" = "mixedbench/registry/files/sources.yaml"
"registry/registry.csv" = "mixedbench/registry/files/registry.csv"
"registry/excluded.csv" = "mixedbench/registry/files/excluded.csv"
"registry/dimensions.csv" = "mixedbench/registry/files/dimensions.csv"
"registry/columns.csv" = "mixedbench/registry/files/columns.csv"
"registry/quantiles.yaml" = "mixedbench/registry/files/quantiles.yaml"
"registry/SUMMARY.md" = "mixedbench/registry/files/SUMMARY.md"
"registry/manifest.csv" = "mixedbench/registry/files/manifest.csv"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/mixedbench",
    "registry/sources.yaml",
    "registry/registry.csv",
    "registry/excluded.csv",
    "registry/dimensions.csv",
    "registry/columns.csv",
    "registry/quantiles.yaml",
    "registry/SUMMARY.md",
    "registry/manifest.csv",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "registry/*.csv" },
    { file = "registry/*.yaml" },
    { file = "registry/SUMMARY.md" },
]

[tool.ruff]
line-length = 100
extend-exclude = ["survey/archive"]  # frozen at tag survey-archive, not maintained

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's defaults kept; survey tests run by hand (`uv run pytest survey/tests`);
# registry/cache holds fetched repositories with tests of their own
norecursedirs = [".*", "build", "dist", "venv", "*.egg", "survey", "cache"]
addopts = "-m 'not network' --import-mode=importlib"
markers = [
    "network: fetches a source over the network; runs only in the CI fetch matrix",
]
