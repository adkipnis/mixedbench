# Tier O keyword net (#24): OpenML, UCI and PMLB searched for tables with a documented clustering
# column; the cap applies over the three repositories together, drawn with `seed` where exceeded.
# The Tier O keyword net (#24): `net.py` ran it on 2026-10-07 over every active OpenML dataset
# (REST API, lowest version per name, 10 <= rows <= 1e6, <= 500 columns, the synthetic BNG(...)
# and seeded resamples left out), every UCI dataset (its `variables` list) and every PMLB
# dataset at commit 7c1f4bd (its metadata.yaml features). A table is a hit when a column name,
# tokenised, is a keyword alone or with an id-like token. Hits and the seeded draw of `cap` of
# them are in net_hits.csv; the kept hits are the `O` entries above. Six OpenML datasets
# answered 500 to the features call twice and are unchecked (ids in net_hits.csv's run log).
nets:
  repositories: [openml, uci, pmlb]
  keywords: [subject, participant, patient, site, hospital, school, classroom, plot, block, herd, farm, judge, rater, family, household, litter]
  cap: 30
  hits: {openml: 65, uci: 6, pmlb: 5}
  unchecked: [openml:4533, openml:23383, openml:41147, openml:43034, openml:45583, openml:46520]
